name: Nix CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Flake checks and package build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          enable_kvm: false
      - name: Check flake and build package
        run: nix flake check --no-update-lock-file --print-build-logs
